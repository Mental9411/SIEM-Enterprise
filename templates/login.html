<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — SIEM Enterprise</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #00ffa3; --bg: #04060f; --card: rgba(8,14,30,0.95); }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg); color: #e8eaf0;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background-image: linear-gradient(rgba(0,255,163,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,255,163,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        .box {
            background: var(--card); border: 1px solid rgba(0,255,163,0.15);
            border-radius: 20px; padding: 48px 40px; width: 400px;
            box-shadow: 0 0 80px rgba(0,255,163,0.05), 0 30px 80px rgba(0,0,0,0.5);
        }
        .logo { text-align:center; margin-bottom:32px; }
        .logo-icon {
            width:64px; height:64px; border-radius:16px;
            background: linear-gradient(135deg, rgba(0,255,163,0.2), rgba(0,212,255,0.2));
            border: 1px solid var(--accent); display:flex; align-items:center; justify-content:center;
            font-size:28px; margin: 0 auto 16px; box-shadow: 0 0 30px rgba(0,255,163,0.2);
        }
        h1 { font-family:'Orbitron',monospace; font-size:1.3rem; font-weight:900; color:var(--accent); }
        .sub { font-size:0.75rem; color:#8892a4; margin-top:4px; letter-spacing:2px; text-transform:uppercase; }
        .form-group { margin-bottom:16px; }
        label { display:block; font-size:0.72rem; font-weight:600; color:#8892a4; text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
        input {
            width:100%; padding:12px 16px;
            background:rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.08);
            border-radius:10px; color:#e8eaf0; font-size:0.875rem;
            font-family:'Inter',sans-serif; outline:none; transition:border-color 0.2s;
        }
        input:focus { border-color:var(--accent); }
        .btn {
            width:100%; padding:13px; border-radius:10px; border:none;
            background:var(--accent); color:#000; font-weight:700; font-size:0.95rem;
            cursor:pointer; transition:all 0.2s; font-family:'Inter',sans-serif;
            margin-top:8px;
        }
        .btn:hover { background:#00cc82; box-shadow:0 0 20px rgba(0,255,163,0.3); }
        .err { background:rgba(255,51,102,0.1); border:1px solid rgba(255,51,102,0.3); color:#ff3366; padding:10px 14px; border-radius:8px; font-size:0.8rem; margin-bottom:16px; }
        .hint { text-align:center; font-size:0.72rem; color:#4a5568; margin-top:20px; font-family:'JetBrains Mono',monospace; }
    </style>
</head>
<body>
    <div class="box">
        <div class="logo">
            <div class="logo-icon">🛡️</div>
            <h1>SIEM Enterprise</h1>
            <div class="sub">Security Intelligence Platform</div>
        </div>
        {% if error %}<div class="err">⚠️ {{ error }}</div>{% endif %}
        <form method="POST" action="/login">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter username" autofocus required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn">Sign In →</button>
        </form>
        <div class="hint">Default: admin / admin123</div>
    </div>
</body>
</html>
